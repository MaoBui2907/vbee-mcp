[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vbee-mcp"
version = "0.1.2"
description = "Unofficial MCP server for vbee.vn (TTS + STT)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MaoBui2907" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "vbee",
    "tts",
    "stt",
    "vietnamese",
    "text-to-speech",
    "speech-to-text",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mcp==1.30.0",
    "httpx>=0.27,<0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
vbee-mcp = "vbee_mcp.server:main"

[project.urls]
Homepage = "https://github.com/MaoBui2907/vbee-mcp"
Repository = "https://github.com/MaoBui2907/vbee-mcp"
Issues = "https://github.com/MaoBui2907/vbee-mcp/issues"
Changelog = "https://github.com/MaoBui2907/vbee-mcp/releases"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
